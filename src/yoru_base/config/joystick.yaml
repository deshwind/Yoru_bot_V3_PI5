joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    # The whole twist_mux chain is plain Twist; only the last hop into
    # Jazzy's diff_drive_controller is stamped, by twist_stamper_node.
    # Stated explicitly so a future change to this default cannot silently
    # take the joystick off the mux (highest-priority input = manual
    # override and e-stop, so it must never go quiet).
    publish_stamped_twist: false

    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 0.5
    scale_angular_turbo:
      yaw: 1.0


    enable_button: 6
    enable_turbo_button: 7

    require_enable_button: true